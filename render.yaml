services:
  # Backend API
  - type: web
    name: casinofun-api
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && gunicorn -w 1 -b 0.0.0.0:$PORT --timeout 120 app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
    healthCheckPath: /api/health

  # Bot Engine (Background Worker)
  - type: worker
    name: casinofun-bots
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python bot_engine.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
